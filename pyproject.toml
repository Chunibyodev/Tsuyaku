[project]
name = "tsuyaku"
version = "1.0.0"
description = "Live Japanese→English for YouTube in Firefox: subtitles on the player, translated chat and an English→Japanese message box, all running on your own PC."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chunibyodev", email = "contact@chunibyo.dev" }]
keywords = ["youtube", "translation", "japanese", "subtitles", "firefox-extension", "whisper", "llama-cpp", "vtuber"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment :: Mozilla",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "av>=12.0",
    "onnxruntime>=1.18",
    "faster-whisper>=1.1.0",
    "sherpa-onnx>=1.12",
    "sherpa-onnx-core>=1.12",
    "tzdata>=2024.1",
    "huggingface-hub>=0.24",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/Chunibyodev/tsuyaku"
Issues = "https://github.com/Chunibyodev/tsuyaku/issues"
Changelog = "https://github.com/Chunibyodev/tsuyaku/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# CUDA 12 runtime libraries for faster-whisper (CTranslate2) on NVIDIA GPUs.
# Pinned to CUDA 12 because CUDA 13 dropped Pascal (GTX 10-series) support.
cuda = [
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9.1,<10",
]

[project.scripts]
tsuyaku = "tsuyaku.__main__:main"
# Started by Firefox (native messaging) when the Tsuyaku extension is switched on.
tsuyaku-host = "tsuyaku.host.service:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsuyaku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
